openapi: 3.1.0
info:
  title: Projet J2E API
  version: 1.0.0
  description: |
    Contrats HTTP du projet. Toutes les routes sécurisées utilisent la session
    courante du serveur; le client ne fournit jamais directement son entreprise.
servers:
  - url: /api
    description: API proxifiée vers le backend Spring Boot
tags:
  - name: Authentication
  - name: Companies
  - name: Users
  - name: Profiles
  - name: Departments
  - name: Documents
  - name: Activity
    description: |
      Journal d'activité (T36) : opérations sur les documents et changements de droits, avec auteur et date.
      L'administrateur voit toute son entreprise ; un membre, l'activité des éléments qu'il peut voir aujourd'hui.
      Ni contenu de fichier, ni message de chat, ni secret.
  - name: Chat
    description: |
      Conversations privées entre deux membres actifs d'une même entreprise (T33).
      Une conversation dont le compte n'est pas participant renvoie 404, y compris pour l'administrateur.
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Créer un compte en attente d'approbation
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé avec le statut PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/login:
    post:
      tags: [Authentication]
      summary: Ouvrir une session utilisateur
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session ouverte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Fermer la session courante
      operationId: logout
      responses:
        '204':
          description: Session invalidée
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/session:
    get:
      tags: [Authentication]
      summary: Lire la session courante
      operationId: getSession
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Companies]
      summary: Lire une entreprise
      operationId: getCompany
      responses:
        '200':
          description: Entreprise trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users:
    get:
      tags: [Users]
      summary: Lister les comptes de l'entreprise courante
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          description: Filtre par statut de compte
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - name: search
          in: query
          description: Recherche sur le nom, l'identifiant ou l'adresse email
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Page de comptes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Lire un compte
      operationId: getUser
      responses:
        '200':
          description: Compte trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Modifier un compte
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Compte mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /users/{userId}/approve:
    post:
      tags: [Users]
      summary: Approuver une inscription
      operationId: approveUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Compte approuvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{userId}/decline:
    post:
      tags: [Users]
      summary: Refuser une inscription
      operationId: declineUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Inscription refusée et compte supprimé
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /profiles/me:
    get:
      tags: [Profiles]
      summary: Lire mon profil
      operationId: getMyProfile
      responses:
        '200':
          description: Profil trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profiles]
      summary: Modifier mon profil
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /departments:
    get:
      tags: [Departments]
      summary: Lister les départements de l'entreprise courante
      operationId: listDepartments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Page de départements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Departments]
      summary: Créer un département et son dossier racine
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '200':
          description: Département créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /departments/{departmentId}:
    put:
      tags: [Departments]
      summary: Renommer un département
      operationId: updateDepartment
      parameters:
        - name: departmentId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
      responses:
        '200':
          description: Département mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /departments/{departmentId}/members:
    put:
      tags: [Departments]
      summary: Ajouter ou modifier le niveau d'un membre
      operationId: setDepartmentMember
      parameters:
        - name: departmentId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentMembershipRequest'
      responses:
        '200':
          description: Adhésion enregistrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentMembership'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /departments/{departmentId}/members/{memberId}:
    delete:
      tags: [Departments]
      summary: Retirer un membre d'un département
      operationId: removeDepartmentMember
      parameters:
        - name: departmentId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: memberId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '204':
          description: Adhésion supprimée
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /folders:
    post:
      tags: [Documents]
      summary: Créer un sous-dossier
      description: |
        Exige le droit de modification du dossier parent. Le dossier hérite du département
        et du seuil du parent ; le compte connecté en devient propriétaire.
      operationId: createFolder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFolderRequest'}
      responses:
        '201':
          description: Dossier créé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /folders/{folderId}:
    patch:
      tags: [Documents]
      summary: Renommer un dossier
      description: Exige le droit de modification. Une racine de département se renomme avec son département.
      operationId: renameFolder
      parameters:
        - name: folderId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameFolderRequest'}
      responses:
        '200':
          description: Dossier renommé (nouvelle version)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Documents]
      summary: Supprimer un dossier et tout son contenu
      description: |
        Exige le droit de suppression sur chaque élément du sous-arbre, sinon rien n'est supprimé.
        Les contenus des fichiers sont effacés du stockage après validation. Une racine de département
        ne peut pas être supprimée ici.
      operationId: deleteFolder
      parameters:
        - name: folderId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: version
          in: query
          description: Version chargée par le client ; 409 si elle a changé.
          schema: {type: integer, format: int64}
      responses:
        '204':
          description: Dossier supprimé
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /folders/{folderId}/files:
    post:
      tags: [Documents]
      summary: Importer un fichier dans un dossier
      description: |
        Envoi multipart/form-data avec le contenu dans le champ « file » et le jeton CSRF en en-tête.
        Exige le droit de modification du dossier. Le fichier hérite du département et du seuil du dossier ;
        le compte connecté en devient propriétaire. Le nom est celui du fichier envoyé, sans chemin ;
        il doit être libre dans le dossier (le remplacement d'un fichier existant relève de T23).
        Le contenu est rangé dans le stockage privé de l'entreprise sous un nom généré : aucun chemin
        n'est renvoyé. Taille maximale : spring.servlet.multipart.max-file-size (20 Mo par défaut).
      operationId: uploadFile
      parameters:
        - name: folderId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Contenu non vide ; son nom et son type MIME sont repris
      responses:
        '201':
          description: Fichier importé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/StorageError'
  /files/{fileId}/content:
    get:
      tags: [Documents]
      summary: Afficher le contenu d'un fichier (aperçu)
      description: |
        Exige le droit de consultation ; un fichier invisible, d'une autre entreprise ou un dossier renvoie 404.
        Les métadonnées sont servies par GET /nodes/{nodeId}.
        Seuls les formats sans contenu actif sont servis en ligne (Content-Disposition: inline) :
        texte (toujours en text/plain, y compris HTML et XML), images PNG, JPEG, GIF, WebP, BMP, AVIF, et PDF.
        Les autres formats, dont SVG, sont servis en application/octet-stream et en pièce jointe :
        l'interface propose alors le téléchargement.
      operationId: getFileContent
      parameters:
        - name: fileId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: If-None-Match
          in: header
          required: false
          description: ETag déjà reçu ("{id}-{version}") ; 304 si le fichier n'a pas changé
          schema: {type: string}
        - name: Range
          in: header
          required: false
          description: Plage d'octets (bytes=début-fin), utile aux lecteurs PDF
          schema: {type: string}
      responses:
        '200':
          description: Contenu du fichier
          headers:
            ETag: {description: '"{id}-{version}" : change à chaque nouvelle version du fichier', schema: {type: string}}
            Cache-Control: {description: 'no-cache, private', schema: {type: string}}
            X-Content-Type-Options: {description: nosniff, schema: {type: string}}
          content:
            text/plain: {schema: {type: string}}
            image/*: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
            application/octet-stream: {schema: {type: string, format: binary}}
        '206':
          description: Plage d'octets demandée
        '304':
          description: Contenu inchangé depuis l'ETag fourni
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/StorageError'
    put:
      tags: [Documents]
      summary: Enregistrer le texte d'un fichier
      description: |
        Réservé aux fichiers texte (ceux dont l'aperçu est servi en text/plain) ; contenu encodé en UTF-8.
        Exige le droit de modification. La version chargée est obligatoire : si le fichier a changé depuis,
        409 et rien n'est écrit ; l'interface garde le brouillon et propose de recharger.
        Le nouveau contenu est écrit à part ; l'ancien n'est effacé qu'après validation.
      operationId: saveFileText
      parameters:
        - name: fileId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaveTextRequest'}
      responses:
        '200':
          description: Fichier enregistré, avec sa nouvelle version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/StorageError'
  /files/{fileId}/download:
    get:
      tags: [Documents]
      summary: Télécharger un fichier
      description: |
        Exige le droit de consultation. Contenu en pièce jointe, sous le nom du fichier
        (filename ASCII de secours et filename* en UTF-8) et avec son type MIME enregistré.
      operationId: downloadFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: If-None-Match
          in: header
          required: false
          description: ETag déjà reçu ("{id}-{version}") ; 304 si le fichier n'a pas changé
          schema: {type: string}
        - name: Range
          in: header
          required: false
          description: Plage d'octets (bytes=début-fin), utile aux lecteurs PDF
          schema: {type: string}
      responses:
        '200':
          description: Contenu du fichier en pièce jointe
          headers:
            ETag: {description: '"{id}-{version}" : change à chaque nouvelle version du fichier', schema: {type: string}}
            Cache-Control: {description: 'no-cache, private', schema: {type: string}}
            X-Content-Type-Options: {description: nosniff, schema: {type: string}}
          content:
            application/octet-stream: {schema: {type: string, format: binary}}
        '206':
          description: Plage d'octets demandée
        '304':
          description: Contenu inchangé depuis l'ETag fourni
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/StorageError'
  /files/{fileId}/replace:
    post:
      tags: [Documents]
      summary: Remplacer le contenu d'un fichier
      description: |
        Envoi multipart/form-data : contenu dans « file », version chargée dans « version » (obligatoire).
        Exige le droit de modification. Le nom affiché ne change pas ; le nom d'origine, le type et la taille
        sont ceux du nouveau fichier. Mêmes règles de conflit et de stockage que l'enregistrement d'un texte.
      operationId: replaceFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, version]
              properties:
                file: {type: string, format: binary}
                version: {type: integer, format: int64}
      responses:
        '200':
          description: Contenu remplacé, avec la nouvelle version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/StorageError'
  /files/{fileId}:
    patch:
      tags: [Documents]
      summary: Renommer un fichier
      description: Exige le droit de modification ; le nom doit rester libre dans le dossier (casse ignorée).
      operationId: renameFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameFileRequest'}
      responses:
        '200':
          description: Fichier renommé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Documents]
      summary: Supprimer un fichier
      description: |
        Exige le droit de suppression (propriétaire ou niveau supérieur au seuil). Le contenu est effacé
        du stockage après validation. Pour déplacer un fichier, utiliser POST /nodes/{nodeId}/move.
      operationId: deleteFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: version
          in: query
          required: false
          description: Version chargée ; 409 si le fichier a changé depuis
          schema: {type: integer, format: int64}
      responses:
        '204':
          description: Fichier supprimé
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /folders/roots:
    get:
      tags: [Documents]
      summary: Lister les dossiers racines des départements accessibles
      description: |
        Un membre voit la racine des départements où il a une adhésion de niveau suffisant ;
        l'administrateur d'entreprise voit toutes les racines. Tri par nom.
      operationId: listRootFolders
      responses:
        '200':
          description: Dossiers racines visibles
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Node'}
        '403':
          $ref: '#/components/responses/Forbidden'
  /folders/{folderId}/children:
    get:
      tags: [Documents]
      summary: Lister les enfants visibles d'un dossier
      description: |
        Seuls les éléments dont le seuil minAccessLevel ne dépasse pas le niveau du compte
        dans le département sont renvoyés et comptés dans la pagination.
        Tri : dossiers d'abord, puis par nom.
      operationId: listFolderChildren
      parameters:
        - name: folderId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page d'éléments visibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /nodes/{nodeId}:
    get:
      tags: [Documents]
      summary: Lire les métadonnées d'un dossier ou d'un fichier
      description: Un élément invisible pour le compte ou d'une autre entreprise renvoie 404.
      operationId: getNode
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Élément et fil d'Ariane
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /nodes/{nodeId}/move:
    post:
      tags: [Documents]
      summary: Déplacer un dossier ou un fichier
      description: |
        Exige le droit de suppression sur l'élément et le droit de création dans le dossier cible.
        Refusé (400, avec explication) si le déplacement crée un cycle ou si le seuil de l'élément
        est inférieur à celui de la cible. Un dossier emmène son sous-arbre, qui prend le département de la cible.
      operationId: moveNode
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MoveNodeRequest'}
      responses:
        '200':
          description: Élément déplacé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /activity:
    get:
      tags: [Activity]
      summary: Fil d'activité de l'entreprise
      description: |
        La plus récente d'abord. Administrateur : toute l'activité de l'entreprise, y compris départements,
        adhésions et comptes. Membre : seulement les entrées des éléments qu'il peut voir aujourd'hui
        (élément supprimé : selon le dernier département et le dernier seuil qu'il avait).
      operationId: listActivity
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page d'activité
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityPage'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
  /nodes/{nodeId}/activity:
    get:
      tags: [Activity]
      summary: Historique d'un dossier ou d'un fichier
      description: Exige de pouvoir voir l'élément (404 sinon).
      operationId: listNodeActivity
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page d'activité de l'élément
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityPage'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations:
    post:
      tags: [Chat]
      summary: Ouvrir ou retrouver la conversation avec un collègue
      description: |
        Une seule conversation par paire, quel que soit celui qui l'ouvre. Le collègue doit être actif
        et de la même entreprise (404 sinon) ; on ne peut pas s'écrire à soi-même (400).
      operationId: openConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [peerId]
              properties:
                peerId: {type: integer, format: int64}
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Chat]
      summary: Lister mes conversations
      description: La plus récemment active d'abord, avec le dernier message et le nombre de non-lus.
      operationId: listConversations
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page de conversations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPage'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
  /conversations/unread:
    get:
      tags: [Chat]
      summary: Total de mes messages non lus
      operationId: countUnreadMessages
      responses:
        '200':
          description: Total des non-lus, toutes conversations confondues
          content:
            application/json:
              schema:
                type: object
                required: [total]
                properties:
                  total: {type: integer, format: int64}
        '403':
          $ref: '#/components/responses/Forbidden'
  /conversations/{conversationId}:
    get:
      tags: [Chat]
      summary: Lire une conversation
      operationId: getConversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{conversationId}/messages:
    get:
      tags: [Chat]
      summary: Historique paginé par curseur
      description: |
        Messages en ordre chronologique. Sans curseur : les derniers messages ; before : les messages
        plus anciens que cet identifiant (remonter l'historique) ; after : les messages qui suivent
        (rattrapage après coupure, à rappeler tant que hasMore est vrai). before et after s'excluent.
      operationId: listMessages
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: before
          in: query
          required: false
          schema: {type: integer, format: int64}
        - name: after
          in: query
          required: false
          schema: {type: integer, format: int64}
        - name: size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        '200':
          description: Page de messages
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Chat]
      summary: Envoyer un message
      description: |
        Texte non vide de 4000 caractères au plus. clientMessageId (facultatif, 64 caractères au plus),
        choisi par le client, rend l'envoi idempotent : un renvoi après coupure renvoie le message déjà
        enregistré (200) au lieu d'en créer un second. Si le correspondant n'est plus actif, la conversation
        est en lecture seule (403).
      operationId: sendMessage
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendMessageRequest'}
      responses:
        '201':
          description: Message enregistré
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatMessage'}
        '200':
          description: Renvoi d'un message déjà enregistré (même clientMessageId)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatMessage'}
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{conversationId}/read:
    post:
      tags: [Chat]
      summary: Marquer des messages comme lus
      description: |
        Marque lus les messages jusqu'à lastMessageId inclus, ou tous si le corps est absent.
        Le marqueur ne recule jamais. Ses propres messages comptent comme lus.
      operationId: markConversationRead
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lastMessageId: {type: integer, format: int64}
      responses:
        '200':
          description: Conversation avec ses non-lus à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      description: Index de page basé sur zéro
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Nombre d'éléments demandés par page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: "Tri au format champ,direction. Direction: asc ou desc"
      schema:
        type: string
        example: name,asc
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password, confirmPassword, firstName, lastName, companyCode]
      properties:
        username: {type: string, minLength: 3, maxLength: 50}
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8, maxLength: 72}
        confirmPassword: {type: string, format: password, minLength: 8, maxLength: 72}
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, minLength: 1, maxLength: 100}
        companyCode: {type: string, minLength: 1, maxLength: 100}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 1}
    RegistrationResponse:
      type: object
      required: [id, status, message]
      properties:
        id: {type: integer, format: int64}
        status: {$ref: '#/components/schemas/AccountStatus'}
        message: {type: string}
    SessionResponse:
      type: object
      required: [authenticated, user]
      properties:
        authenticated: {type: boolean}
        user:
          $ref: '#/components/schemas/SessionUser'
    SessionUser:
      type: object
      required: [id, username, firstName, lastName, email, role, status, companyId]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}
        status: {$ref: '#/components/schemas/AccountStatus'}
        companyId: {type: integer, format: int64}
    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, DISABLED]
    UserRole:
      type: string
      enum: [MEMBER, COMPANY_ADMIN]
    Company:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
    User:
      type: object
      required: [id, username, firstName, lastName, email, status, role, companyId]
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string, format: email}
        status: {$ref: '#/components/schemas/AccountStatus'}
        role: {$ref: '#/components/schemas/UserRole'}
        companyId: {type: integer, format: int64}
    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        username: {type: string, minLength: 3, maxLength: 50}
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, format: email}
        status: {$ref: '#/components/schemas/AccountStatus'}
        role: {$ref: '#/components/schemas/UserRole'}
    Profile:
      type: object
      required: [id, bio, profilePictureUrl]
      properties:
        id: {type: integer, format: int64}
        bio: {type: string, maxLength: 2000}
        profilePictureUrl: {type: [string, 'null'], format: uri}
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        bio: {type: string, maxLength: 2000}
        profilePictureUrl: {type: [string, 'null'], format: uri}
    Department:
      type: object
      required: [id, name, companyId]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        companyId: {type: integer, format: int64}
    CreateDepartmentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
    DepartmentMembershipRequest:
      type: object
      additionalProperties: false
      required: [userId, accessLevel]
      properties:
        userId: {type: integer, format: int64}
        accessLevel: {type: integer, minimum: 0}
    DepartmentMembership:
      type: object
      required: [id, userId, departmentId, accessLevel]
      properties:
        id: {type: integer, format: int64}
        userId: {type: integer, format: int64}
        departmentId: {type: integer, format: int64}
        accessLevel: {type: integer, minimum: 0}
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages, first, last]
      properties:
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
        first: {type: boolean}
        last: {type: boolean}
    UserPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/User'}
        page: {$ref: '#/components/schemas/PageMeta'}
    DepartmentPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Department'}
        page: {$ref: '#/components/schemas/PageMeta'}
    CreateFolderRequest:
      type: object
      required: [parentId, name]
      properties:
        parentId: {type: integer, format: int64}
        name: {type: string, minLength: 1, maxLength: 255, description: "Sans / ni \\ ; unique dans le dossier (casse ignorée)"}
    RenameFolderRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        version: {type: integer, format: int64, description: Version chargée ; 409 si elle a changé}
    SaveTextRequest:
      type: object
      required: [content, version]
      properties:
        content: {type: string, description: Texte complet ; chaîne vide pour vider le fichier}
        version: {type: integer, format: int64, description: Version chargée par le client}
    RenameFileRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 255}
        version: {type: integer, format: int64, description: Version chargée (facultative) ; 409 si elle a changé}
    ActivityEntry:
      type: object
      required: [id, action, category, label, occurredAt]
      description: |
        À afficher : « {actor.firstName} {label} {nodeName ou departmentName} », puis targetUserName et details.
        node* et department* décrivent l'élément au moment de l'action ; nodeId peut désigner un élément supprimé.
      properties:
        id: {type: integer, format: int64}
        action:
          type: string
          enum: [FOLDER_CREATED, FOLDER_RENAMED, FOLDER_DELETED, NODE_MOVED, FILE_UPLOADED, FILE_SAVED,
                 FILE_REPLACED, FILE_RENAMED, FILE_DELETED, THRESHOLD_CHANGED, CONTRIBUTOR_ADDED,
                 CONTRIBUTOR_REMOVED, DEPARTMENT_CREATED, DEPARTMENT_RENAMED, MEMBER_ACCESS_SET,
                 MEMBER_REMOVED, ACCOUNT_APPROVED, ACCOUNT_DECLINED, ACCOUNT_DISABLED]
        category: {type: string, enum: [DOCUMENT, RIGHTS, ADMINISTRATION]}
        label: {type: string, example: a renommé le dossier}
        occurredAt: {type: string, format: date-time}
        actor:
          oneOf:
            - type: object
              required: [id, firstName, lastName]
              properties:
                id: {type: integer, format: int64}
                firstName: {type: string}
                lastName: {type: string}
            - type: 'null'
        nodeId: {type: [integer, 'null'], format: int64}
        nodeName: {type: [string, 'null']}
        nodeKind: {type: [string, 'null'], enum: [folder, file, null]}
        departmentId: {type: [integer, 'null'], format: int64}
        departmentName: {type: [string, 'null']}
        targetUserId: {type: [integer, 'null'], format: int64}
        targetUserName: {type: [string, 'null']}
        details: {type: [string, 'null'], example: « Archives » → « Archives 2025 »}
    ActivityPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ActivityEntry'}
        page: {$ref: '#/components/schemas/PageMeta'}
    ChatParticipant:
      type: object
      required: [id, firstName, lastName, username, active]
      properties:
        id: {type: integer, format: int64}
        firstName: {type: string}
        lastName: {type: string}
        username: {type: string}
        active: {type: boolean, description: Faux si le compte a été désactivé}
    ChatMessage:
      type: object
      required: [id, conversationId, senderId, content, sentAt, mine]
      properties:
        id: {type: integer, format: int64, description: Croissant avec l'ordre d'envoi ; sert de curseur}
        conversationId: {type: integer, format: int64}
        senderId: {type: integer, format: int64}
        content: {type: string, maxLength: 4000}
        sentAt: {type: string, format: date-time}
        clientMessageId: {type: [string, 'null'], maxLength: 64}
        mine: {type: boolean, description: Message envoyé par le compte connecté}
    Conversation:
      type: object
      required: [id, peer, unreadCount, canSend, createdAt, lastActivityAt]
      properties:
        id: {type: integer, format: int64}
        peer: {$ref: '#/components/schemas/ChatParticipant'}
        lastMessage:
          oneOf:
            - $ref: '#/components/schemas/ChatMessage'
            - type: 'null'
        unreadCount: {type: integer, format: int64}
        lastReadMessageId: {type: [integer, 'null'], format: int64}
        canSend: {type: boolean, description: Faux si le correspondant n'est plus actif (lecture seule)}
        createdAt: {type: string, format: date-time}
        lastActivityAt: {type: string, format: date-time}
    ConversationPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Conversation'}
        page: {$ref: '#/components/schemas/PageMeta'}
    MessagePage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ChatMessage'}
        hasMore: {type: boolean, description: D'autres messages existent au-delà de la page}
    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content: {type: string, maxLength: 4000}
        clientMessageId: {type: string, maxLength: 64}
    MoveNodeRequest:
      type: object
      required: [targetFolderId]
      properties:
        targetFolderId: {type: integer, format: int64}
        version: {type: integer, format: int64, description: Version chargée ; 409 si elle a changé}
    NodePermissions:
      type: object
      description: Actions autorisées pour le compte connecté (PermissionService).
      required: [view, modify, delete, manage, createChild]
      properties:
        view: {type: boolean}
        modify: {type: boolean}
        delete: {type: boolean}
        manage: {type: boolean, description: Gérer le partage (seuil, contributeurs)}
        createChild: {type: boolean}
    NodeOwner:
      type: object
      required: [id, firstName, lastName]
      properties:
        id: {type: integer, format: int64}
        firstName: {type: string}
        lastName: {type: string}
    Node:
      type: object
      description: Dossier ou fichier. Le chemin de stockage n'est jamais exposé ; les champs fichier sont null pour un dossier.
      required: [id, name, kind, departmentId, departmentName, minAccessLevel, owner, createdAt, version, permissions]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        kind: {type: string, enum: [folder, file]}
        parentId: {type: [integer, 'null'], format: int64, description: null pour une racine de département}
        departmentId: {type: integer, format: int64}
        departmentName: {type: string}
        minAccessLevel: {type: integer, minimum: 0}
        owner: {$ref: '#/components/schemas/NodeOwner'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: [string, 'null'], format: date-time}
        version: {type: integer, format: int64, description: Version de verrouillage optimiste}
        originalFileName: {type: [string, 'null']}
        contentType: {type: [string, 'null']}
        size: {type: [integer, 'null'], format: int64}
        permissions: {$ref: '#/components/schemas/NodePermissions'}
    NodePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Node'}
        page: {$ref: '#/components/schemas/PageMeta'}
    BreadcrumbItem:
      type: object
      required: [id, name]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
    NodeDetail:
      type: object
      required: [node, path]
      properties:
        node: {$ref: '#/components/schemas/Node'}
        path:
          type: array
          description: Dossiers parents, de la racine du département au parent direct (vide pour une racine).
          items: {$ref: '#/components/schemas/BreadcrumbItem'}
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: VALIDATION_FAILED}
        message: {type: string}
        errors:
          type: object
          additionalProperties:
            type: string
          description: Erreurs champ par champ, par exemple confirmPassword
  responses:
    BadRequest:
      description: Requête invalide ou mal formée
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {code: BAD_REQUEST, message: Requête invalide}
    Unauthorized:
      description: Session absente ou expirée
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {code: UNAUTHORIZED, message: Session requise}
    Forbidden:
      description: Authentifié mais sans droit suffisant
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {code: FORBIDDEN, message: Droit insuffisant}
    NotFound:
      description: Ressource inexistante ou hors de l'entreprise courante
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {code: NOT_FOUND, message: Ressource introuvable}
    Conflict:
      description: Conflit métier ou état incompatible
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {code: CONFLICT, message: Identifiant déjà utilisé}
    PayloadTooLarge:
      description: Fichier plus gros que la taille maximale configurée
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {code: PAYLOAD_TOO_LARGE, message: Le fichier dépasse la taille maximale autorisée (20 Mo).}
    StorageError:
      description: Échec d'écriture dans le stockage ; aucun élément n'est créé
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example: {code: STORAGE_ERROR, message: Le fichier n'a pas pu être enregistré.}
    ValidationFailed:
      description: Validation métier ou des champs échouée
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            code: VALIDATION_FAILED
            message: La requête contient des erreurs
            errors:
              email: Cet email est déjà utilisé
