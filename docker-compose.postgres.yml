services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: projetj2e
      POSTGRES_USER: projetj2e
      POSTGRES_PASSWORD: projetj2e
    ports:
      - "5433:5432"
    volumes:
      - projetj2e_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projetj2e -d projetj2e"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  projetj2e_postgres:
