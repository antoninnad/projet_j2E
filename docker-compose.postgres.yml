services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projetj2e}
      POSTGRES_USER: ${POSTGRES_USER:-projetj2e}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
    ports:
      - "5433:5432"
    volumes:
      - projetj2e_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-projetj2e}
      POSTGRES_USER: ${POSTGRES_USER:-projetj2e}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
      APP_STORAGE_ROOT: /app/storage
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - projetj2e_storage:/app/storage
    restart: unless-stopped

volumes:
  projetj2e_postgres:
  projetj2e_storage:
