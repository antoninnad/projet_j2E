<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Créer un compte</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <form th:action="@{/register}" th:object="${userDto}" method="post">
        <h1>Create an account</h1>

        <label for="username">Username</label>
        <input type="text" id="username" th:field="*{username}" required>
        <span class="error" style="color: red;"
              th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" required>
        <span class="error" style="color: red;"
              th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" autocomplete="new-password" required>
        <span class="error" style="color: red;"
              th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password" required>
        <span class="error" style="color: red;"
              th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>

        <label for="firstName">First name</label>
        <input type="text" id="firstName" th:field="*{firstName}" required>
        <span class="error" style="color: red;"
              th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>

        <label for="lastName">Last name</label>
        <input type="text" id="lastName" th:field="*{lastName}" required>
        <span class="error" style="color: red;"
              th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>

        <label for="companyCode">Company code</label>
        <input type="text" id="companyCode" th:field="*{companyCode}" required>
        <span class="error" style="color: red;"
              th:if="${#fields.hasErrors('companyCode')}" th:errors="*{companyCode}"></span>

        <p th:if="${#fields.hasGlobalErrors()}" style="color: red;"
           th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

        <button type="submit">Register</button>

        <p>Already have an account? <a th:href="@{/login}">Log in</a></p>
    </form>
</div>
</body>
</html>
