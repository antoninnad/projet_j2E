<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Inscription', 'Créez votre demande de compte salarié rattaché à votre entreprise sur Lagui.')}"></head>
<body class="flex min-h-svh flex-col bg-canvas text-foreground">
<header th:replace="~{fragments/header :: header('register')}"></header>

<!--/* Bloc Watermelon UI auth-02 (MIT), porté en Thymeleaf. */-->
<main id="contenu" tabindex="-1" class="flex flex-1 items-center justify-center px-2 py-10 sm:px-4">
    <div class="auth-frame max-w-xl space-y-3">
        <div class="auth-card p-5 sm:p-8">
            <div class="mb-6 grid gap-1">
                <h1 class="text-2xl font-extrabold tracking-tight sm:text-3xl">Demander un accès</h1>
                <p class="text-sm leading-relaxed text-muted-foreground">
                    Rejoignez l'espace de votre entreprise avec le code fourni par votre administrateur.
                </p>
            </div>

            <div class="[&:has([role])]:mb-5"><div th:replace="~{fragments/messages :: messages}"></div></div>

            <form th:action="@{/register}" th:object="${userDto}" method="post" class="grid gap-5" novalidate>
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div th:if="${#fields.hasGlobalErrors()}" role="alert"
                     class="alert-base border-destructive-border bg-destructive-subtle text-destructive-foreground">
                    <svg th:replace="~{fragments/ui :: alertIcon('error')}"></svg>
                    <div class="col-start-2 grid gap-1">
                        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erreur d'inscription</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div th:replace="~{fragments/ui :: field('firstName', 'Prénom', 'text', 'given-name', 'Camille', null, 'user')}"></div>
                    <div th:replace="~{fragments/ui :: field('lastName', 'Nom', 'text', 'family-name', 'Martin', null, 'user')}"></div>
                </div>

                <div th:replace="~{fragments/ui :: field('email', 'Adresse e-mail professionnelle', 'email', 'email', 'camille.martin@entreprise.fr', null, 'mail')}"></div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div th:replace="~{fragments/ui :: field('username', 'Identifiant', 'text', 'username', 'camille.martin', null, 'at')}"></div>
                    <div th:replace="~{fragments/ui :: field('companyCode', 'Code entreprise', 'text', 'off', 'ACME-2026', null, 'building')}"></div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div th:replace="~{fragments/ui :: passwordField('password', 'Mot de passe', 'new-password', '8 caractères minimum', null)}"></div>
                    <div th:replace="~{fragments/ui :: passwordField('confirmPassword', 'Confirmation', 'new-password', 'Retapez le mot de passe', null)}"></div>
                </div>

                <button type="submit" class="btn btn-cta mt-1 w-full gap-2">
                    Envoyer ma demande
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>

                <p class="text-center text-xs leading-relaxed text-muted-foreground">
                    Votre compte reste en attente jusqu'à sa validation par l'administrateur de votre entreprise.
                </p>
            </form>
        </div>

        <p class="px-4 pb-1 text-center text-sm text-muted-foreground">
            Vous avez déjà un compte ?
            <a th:href="@{/login}" class="font-semibold text-primary underline-offset-4 hover:underline">Se connecter</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
