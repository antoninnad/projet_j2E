<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Connexion administrateur', 'Accès réservé aux administrateurs de la plateforme Lagui.')}"></head>
<body class="flex min-h-svh flex-col bg-canvas text-foreground">
<header th:replace="~{fragments/header :: header('admin-login')}"></header>

<!--/* Bloc Watermelon UI auth-01 (MIT), porté en Thymeleaf — variante console plateforme. */-->
<main id="contenu" tabindex="-1" class="flex flex-1 items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">
        <div class="auth-frame">
            <div class="auth-card px-6 py-7">
                <div class="mb-6 grid gap-1 text-center">
                    <p class="text-xs font-semibold tracking-wide text-muted-foreground uppercase">Console plateforme</p>
                    <h1 class="text-xl font-extrabold tracking-tight sm:text-2xl">Connexion administrateur</h1>
                    <p class="text-sm leading-relaxed text-muted-foreground">Entreprises, comptes, départements et ressources.</p>
                </div>

                <div class="[&:has([role])]:mb-5"><div th:replace="~{fragments/messages :: messages}"></div></div>

                <form th:action="@{/adminLogin}" method="post" class="grid gap-4">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="grid gap-1.5">
                        <label for="username" class="text-sm font-medium">Identifiant administrateur</label>
                        <div class="relative">
                            <svg th:replace="~{fragments/ui :: fieldIcon('user')}"></svg>
                            <input id="username" type="text" name="username" autocomplete="username" placeholder="admin" required autofocus class="input-filled" />
                        </div>
                    </div>

                    <div class="grid gap-1.5">
                        <label for="password" class="text-sm font-medium">Mot de passe</label>
                        <div class="relative">
                            <svg th:replace="~{fragments/ui :: fieldIcon('lock')}"></svg>
                            <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Votre mot de passe" required class="input-filled pr-10" />
                            <button th:replace="~{fragments/ui :: passwordToggle('password')}"></button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-cta mt-1 w-full">Se connecter</button>
                </form>
            </div>

            <p class="px-4 pt-4 pb-2 text-center text-sm text-muted-foreground">
                Vous êtes salarié ?
                <a th:href="@{/login}" class="font-semibold text-primary underline-offset-4 hover:underline">Connexion salarié</a>
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
