<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Connexion administrateur', 'Accès réservé aux administrateurs de la plateforme Lagui.')}"></head>
<body class="flex min-h-screen flex-col bg-muted/30 text-foreground">
<header th:replace="~{fragments/header :: header('login')}"></header>

<main id="contenu" tabindex="-1" class="mx-auto flex w-full max-w-7xl flex-1 items-center justify-center px-4 py-10 sm:px-6">
    <section class="w-full max-w-md space-y-6 rounded-2xl border border-border bg-background p-6 shadow-sm sm:p-8">
        <div class="space-y-1.5">
            <span class="inline-flex items-center rounded-full border border-border bg-secondary/70 px-2.5 py-0.5 text-xs font-medium text-foreground">
                Espace administrateur
            </span>
            <h1 class="text-2xl font-semibold tracking-tight">Connexion administrateur</h1>
            <p class="text-sm text-muted-foreground">
                Gérez les demandes d'inscription, les comptes et les départements.
            </p>
        </div>

        <div th:replace="~{fragments/messages :: messages}"></div>

        <form th:action="@{/adminLogin}" method="post" class="space-y-4">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="space-y-1.5">
                <label for="username" class="block text-sm font-medium text-foreground">Identifiant administrateur</label>
                <input id="username"
                       type="text"
                       name="username"
                       autocomplete="username"
                       required
                       autofocus
                       class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground shadow-xs placeholder:text-muted-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring" />
            </div>

            <div class="space-y-1.5">
                <label for="password" class="block text-sm font-medium text-foreground">Mot de passe</label>
                <input id="password"
                       type="password"
                       name="password"
                       autocomplete="current-password"
                       required
                       class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground shadow-xs placeholder:text-muted-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring" />
            </div>

            <button type="submit"
                    class="inline-flex h-10 w-full cursor-pointer items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow-xs transition-opacity hover:opacity-90">
                Se connecter
            </button>
        </form>

        <div class="border-t border-border pt-4 text-center text-sm text-muted-foreground">
            <a th:href="@{/login}" class="font-medium text-foreground underline underline-offset-4 hover:opacity-80">
                Retour à la connexion salarié
            </a>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
