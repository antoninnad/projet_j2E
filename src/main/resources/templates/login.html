<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Connexion', 'Connectez-vous à votre espace collaboratif Lagui.')}"></head>
<body class="flex min-h-svh flex-col bg-canvas text-foreground">
<header th:replace="~{fragments/header :: header('login')}"></header>

<!--/* Bloc Watermelon UI auth-01 (MIT), porté en Thymeleaf : cadre bg-muted + carte intérieure. */-->
<main id="contenu" tabindex="-1" class="flex flex-1 items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">
        <div class="auth-frame">
            <div class="auth-card px-6 py-7">
                <div class="mb-6 grid gap-1 text-center">
                    <h1 class="text-xl font-extrabold tracking-tight sm:text-2xl">Accéder à votre espace</h1>
                    <p class="text-sm leading-relaxed text-muted-foreground">Documents, départements et échanges de votre entreprise.</p>
                </div>

                <div class="[&:has([role])]:mb-5"><div th:replace="~{fragments/messages :: messages}"></div></div>

                <form th:action="@{/login}" th:object="${loginDto}" method="post" class="grid gap-4">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div th:replace="~{fragments/ui :: field('email', 'Adresse e-mail', 'email', 'email', 'prenom.nom@entreprise.fr', null, 'mail')}"></div>
                    <div th:replace="~{fragments/ui :: passwordField('password', 'Mot de passe', 'current-password', 'Votre mot de passe', null)}"></div>

                    <button type="submit" class="btn btn-cta mt-1 w-full">Se connecter</button>
                </form>
            </div>

            <p class="px-4 pt-4 pb-2 text-center text-sm text-muted-foreground">
                Première visite ?
                <a th:href="@{/register}" class="font-semibold text-primary underline-offset-4 hover:underline">Demander un accès</a>
            </p>
        </div>

        <p class="mt-5 text-center text-xs text-muted-foreground">
            <a th:href="@{/adminLogin}" class="underline-offset-4 hover:text-foreground hover:underline">Espace administrateur de la plateforme</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
