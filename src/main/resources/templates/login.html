<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Connexion', 'Connectez-vous à votre espace collaboratif Lagui.')}"></head>
<body class="flex min-h-screen flex-col bg-muted/30 text-foreground">
<header th:replace="~{fragments/header :: header('login')}"></header>

<main id="contenu" tabindex="-1" class="mx-auto flex w-full max-w-7xl flex-1 items-center justify-center px-4 py-10 sm:px-6">
    <section class="w-full max-w-md space-y-6 rounded-2xl border border-border bg-background p-6 shadow-sm sm:p-8">
        <div class="space-y-1.5">
            <h1 class="text-2xl font-semibold tracking-tight">Connexion</h1>
            <p class="text-sm text-muted-foreground">
                Accédez aux documents, départements et échanges de votre entreprise.
            </p>
        </div>

        <div th:replace="~{fragments/messages :: messages}"></div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="space-y-1.5">
                <label for="username" class="block text-sm font-medium text-foreground">
                    Identifiant
                </label>
                <input id="username"
                       type="text"
                       name="username"
                       autocomplete="username"
                       placeholder="prenom.nom"
                       required
                       class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground shadow-xs placeholder:text-muted-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring" />
            </div>

            <div class="space-y-1.5">
                <label for="password" class="block text-sm font-medium text-foreground">
                    Mot de passe
                </label>
                <input id="password"
                       type="password"
                       name="password"
                       autocomplete="current-password"
                       required
                       class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground shadow-xs placeholder:text-muted-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring" />
            </div>

            <button type="submit"
                    class="inline-flex h-10 w-full cursor-pointer items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow-xs transition-opacity hover:opacity-90">
                Se connecter
            </button>
        </form>

        <div class="space-y-2 border-t border-border pt-4 text-center text-sm text-muted-foreground">
            <p>
                Pas encore de compte ?
                <a th:href="@{/register}" class="font-medium text-foreground underline underline-offset-4 hover:opacity-80">
                    Créer une demande d'inscription
                </a>
            </p>
            <p class="text-xs">
                <a th:href="@{/adminLogin}" class="text-muted-foreground underline underline-offset-4 hover:text-foreground">
                    Accès administrateur
                </a>
            </p>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
