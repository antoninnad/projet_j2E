<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First static page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container">
    <h2>Welcome to the First Static Page, login to continue: </h2>
    <div class="login-form">
    <form th:action="@{/login}" method="post" class="form-group">
        <label>Username
            <input type="text" name="username">
        </label>
        <label for="password">Password
            <input type="password" name="password" >
        </label>
        <button type="submit">Login</button>
    </form>
    </div>

    <p th:if="${param.success}" style="color:green;" > account created successfully</p>
    <a th:href="@{/createAccount}" class="btn btn-secondary" method="get">Create Account</a>

</body>
</html>
