<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header(activePage)" class="sticky top-0 z-30 h-14 border-b border-border bg-card/95 backdrop-blur supports-[backdrop-filter]:bg-card/80">
    <a href="#contenu"
       class="sr-only focus:not-sr-only focus:absolute focus:top-2.5 focus:left-3 focus:z-50 focus:rounded-md focus:bg-primary focus:px-3 focus:py-2 focus:text-sm focus:font-medium focus:text-primary-foreground">
        Aller au contenu principal
    </a>

    <div th:classappend="${activePage == 'dashboard'} ? 'max-w-none' : 'max-w-6xl'"
         class="mx-auto flex h-full items-center justify-between gap-3 px-4 sm:px-6">
        <a th:href="@{/}" class="flex min-w-0 items-center gap-2.5 rounded-md text-foreground focus-visible:ring-[3px] focus-visible:ring-ring/50 focus-visible:outline-none">
            <span th:replace="~{fragments/ui :: logo('sm')}"></span>
            <span class="flex flex-col leading-none">
                <span class="text-sm font-semibold tracking-tight">Lagui</span>
                <span class="mt-0.5 hidden text-xs text-muted-foreground sm:block">Espace collaboratif</span>
            </span>
        </a>

        <div th:replace="~{fragments/nav :: nav(${activePage})}"></div>
    </div>
</header>
</body>
</html>
