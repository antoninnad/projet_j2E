# H2 embarquée en fichier : data/projetdb.mv.db (les données survivent aux redémarrages)
spring.datasource.url=jdbc:h2:file:./data/projetdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Frontend React/Vite (vide = assets compilés /ui/app.css et /ui/app.js ; ex. http://localhost:5173 pour HMR)
app.frontend.dev-server-url=

# Stockage privé des fichiers (hors ressources statiques) : {racine}/companies/{idEntreprise}/{uuid}
app.storage.root=./storage
