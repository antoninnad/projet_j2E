spring.profiles.active=h2

# Migrations Flyway communes aux profils
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Frontend React/Vite (vide = assets compilés /ui/app.css et /ui/app.js ; ex. http://localhost:5173 pour HMR)
app.frontend.dev-server-url=

# Stockage privé des fichiers (hors ressources statiques) : {racine}/companies/{idEntreprise}/{uuid}
app.storage.root=./storage

# Imports de fichiers (T21) : au-delà, la réponse est 413 avec un message JSON
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
