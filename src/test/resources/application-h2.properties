# Profil h2 pour les tests : remplace celui de src/main/resources (le classpath de test passe en premier).
# Base H2 en mémoire pour que les tests @SpringBootTest n'écrivent jamais dans data/projetdb du dépôt.
spring.datasource.url=jdbc:h2:mem:projetdb-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
