name: Backend CI

on:
  push:
  pull_request:

jobs:
  h2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Tests H2
        run: ./mvnw test -Dspring.profiles.active=h2

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: projetj2e
          POSTGRES_USER: projetj2e
          POSTGRES_PASSWORD: projetj2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projetj2e -d projetj2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_URL: jdbc:postgresql://localhost:5432/projetj2e
      POSTGRES_USER: projetj2e
      POSTGRES_PASSWORD: projetj2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Tests PostgreSQL
        run: ./mvnw test -Dspring.profiles.active=postgres
